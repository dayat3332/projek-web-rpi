    <rect x="204" y="156" width="24" height="18" rx="5" stroke="#1e293b" stroke-width="4" fill="none" />
    <line x1="196" y1="164" x2="204" y2="164" stroke="#1e293b" stroke-width="4" />
    <line x1="158" y1="162" x2="172" y2="162" stroke="#1e293b" stroke-width="4" />
    <line x1="228" y1="162" x2="242" y2="162" stroke="#1e293b" stroke-width="4" />

    <!-- Nose -->
    <path d="M200 168 L197 178 L203 178" stroke-width="4" />
    
    <!-- Smile -->
    <path d="M190 190 Q200 198 210 190" stroke-width="4" />
    
    <!-- Neck -->
