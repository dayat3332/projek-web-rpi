    <circle cx="215" cy="165" r="4" fill="#1e293b" />
    
    <!-- Eyebrows -->
    <path d="M178 152 Q185 148 192 152" stroke-width="4" />
    <path d="M208 152 Q215 148 222 152" stroke-width="4" />
    
    <!-- Glasses (Optional sleek modern frame) -->
